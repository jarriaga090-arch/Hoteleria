<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCV Monterrey | Eventos 2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #0f2c59;
      --primary-hover: #1a4380;
      --accent: #e65c00;
      --bg-page: #f3f5f8;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --border: #d8dee6;
      --border-focus: #0f2c59;
      --text-main: #1e293b;
      --text-muted: #475569;
      --radius: 10px;
      --shadow: 0 10px 25px -5px rgba(15, 44, 89, 0.08), 0 4px 10px -6px rgba(15, 44, 89, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.55;
      padding: 2rem 1rem 4rem;
    }

    /* Splash Screen */
    #splash-screen {
      position: fixed;
      inset: 0;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #splash-screen img {
      max-width: 280px;
      width: 70%;
      height: auto;
      animation: splashFadeIn 0.8s ease-out forwards;
    }

    .splash-loader {
      margin-top: 1.75rem;
      width: 48px;
      height: 3px;
      background-color: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .splash-loader::after {
      content: "";
      position: absolute;
      left: -50%;
      width: 50%;
      height: 100%;
      background-color: var(--primary);
      border-radius: 999px;
      animation: splashSlide 1.2s ease-in-out infinite;
    }

    @keyframes splashFadeIn {
      from {
        opacity: 0;
        transform: scale(0.94);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes splashSlide {
      0% { left: -50%; }
      100% { left: 100%; }
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      background: var(--bg-card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      border: 1px solid #e5e9f0;
      overflow: hidden;
    }

    /* Encabezado Institucional */
    .form-header {
      padding: 2.5rem 2.5rem 2rem;
      border-bottom: 1px solid var(--border);
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, #f9fbfd 100%);
    }

    .logo-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .header-logo {
      max-height: 68px;
      max-width: 240px;
      width: auto;
      height: auto;
      display: block;
    }

    .form-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.35rem;
      letter-spacing: -0.02em;
    }

    .form-header .subtitle {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .objective-box {
      background-color: #f0f4fa;
      border-left: 4px solid var(--primary);
      padding: 1rem 1.25rem;
      border-radius: 0 var(--radius) var(--radius) 0;
      text-align: left;
      font-size: 0.92rem;
      color: var(--text-main);
    }

    .objective-box strong {
      color: var(--primary);
    }

    /* Cuerpo del formulario */
    form {
      padding: 2rem 2.5rem 2.5rem;
    }

    .form-section {
      margin-bottom: 2.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }

    .form-section:last-of-type {
      border-bottom: none;
      margin-bottom: 1.5rem;
      padding-bottom: 0;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .section-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    /* Grid de campos */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.15rem 1.25rem;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 1.1rem;
    }

    .grid-2 .field-group {
      margin-bottom: 0;
    }

    label.field-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.4rem;
    }

    .req {
      color: #dc2626;
      margin-left: 2px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="number"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 0.65rem 0.85rem;
      font-family: inherit;
      font-size: 0.93rem;
      color: var(--text-main);
      background-color: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(15, 44, 89, 0.12);
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    /* Checkboxes y Radios */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 0.35rem;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      cursor: pointer;
      font-size: 0.93rem;
      color: var(--text-main);
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      transition: background-color 0.15s ease;
    }

    .check-item:hover {
      background-color: var(--bg-subtle);
    }

    .check-item input[type="checkbox"],
    .check-item input[type="radio"] {
      width: 17px;
      height: 17px;
      margin-top: 0.18rem;
      accent-color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
    }

    .event-card-option {
      border: 1px solid var(--border);
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      background: #fff;
    }

    .event-card-option:has(input:checked) {
      border-color: var(--primary);
      background-color: #f4f7fc;
      font-weight: 500;
    }
